name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig*.json'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Cloudflare API は一時的に失敗することがある（2026-07-30 に
      # 「An unknown error has occurred [code: 10013]」でデプロイが落ち、
      # bot が更新した備蓄データが本番へ届かないまま放置された）。
      # 再試行で一過性のものを吸収する。
      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then
              echo "デプロイ成功（試行 ${attempt} 回目）"
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              echo "::warning::デプロイ失敗（試行 ${attempt}/3）。30秒後に再試行する"
              sleep 30
            fi
          done
          echo "::error::デプロイが3回とも失敗した"
          exit 1

      # デプロイが成功を返しても実際に配信できているとは限らない。
      # 最低限の疎通を確認して、壊れた状態で緑になるのを防ぐ。
      - name: Smoke check
        run: |
          for attempt in 1 2 3; do
            CODE=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 \
              "https://surviveasonejp.net/api/health?ci=${GITHUB_RUN_ID}" || echo 000)
            if [ "$CODE" = "200" ]; then
              echo "疎通確認 OK (HTTP 200)"
              exit 0
            fi
            echo "::warning::/api/health が HTTP ${CODE}（試行 ${attempt}/3）"
            sleep 15
          done
          echo "::error::デプロイ後に /api/health が 200 を返さない"
          exit 1
