name: Update oil reserves data

# 資源エネルギー庁「石油備蓄の状況（推計値の速報）」PDF から備蓄日数を日次で取り込む。
#
# Worker 内のフェッチャー（reserves-fetcher.ts）ではなく CI で処理する理由:
# 当該 PDF は FlateDecode + CID エンコードで ToUnicode CMap を持たず、Worker では
# テキストを抽出できない。poppler(pdftotext) が必要なため CI 側で処理する。
#
# 値に変化があった時だけ PR を作り auto-merge を有効化する。
#
# main への直 push は使えない（2026-07-25 実測）。ブランチ保護が
#   - Changes must be made through a pull request.
#   - 2 of 2 required status checks are expected.
# の2点で github-actions[bot] を拒否する（GH006）。管理者は enforce_admins:false で
# バイパスされるが bot は対象外。classic 保護の bypass_pull_request_allowances には
# github-actions を登録できない（API が受理しても反映されない）ため PR 経路を採る。
#
# PR にすることで build / gitleaks の検査も必ず通る。マージ後は deploy.yml を
# 明示的に起動してサイト表示・OGP・API まで追随させる。

on:
  schedule:
    # 毎日 UTC 23:30（JST 08:30）。速報は平日に更新されるため朝までに取り込む
    - cron: '30 23 * * *'
  workflow_dispatch:

permissions:
  contents: write       # ブランチへのコミット・push
  pull-requests: write  # PR 作成・auto-merge 有効化
  actions: write        # deploy.yml の workflow_dispatch 起動

# 同時実行を防ぐ（push 競合の回避）
concurrency:
  group: update-reserves
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # 抽出値が検証に通らない場合、スクリプトは非ゼロ終了して以降を止める
      # （誤ったデータが自動コミットされるのを防ぐ）
      - name: Fetch and update reserves.json
        id: update
        run: node scripts/update-reserves.mjs

      - name: Create pull request
        if: steps.update.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          BRANCH="bot/reserves-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -b "$BRANCH"
          git add src/worker/data/reserves.json
          git commit -m "data(reserves): ${SUMMARY}"
          git push origin "$BRANCH"

          gh pr create \
            --base main --head "$BRANCH" \
            --title "data(reserves): ${SUMMARY}" \
            --body "資源エネルギー庁「石油備蓄の状況（推計値の速報）」より自動取得。

          - 抽出元: \`pl001/pdf-oil-res/oil_daily.pdf\`
          - 生成: \`.github/workflows/update-reserves.yml\`（\`scripts/update-reserves.mjs\`）
          - 検証: 絶対範囲・内訳整合・前回比±50% を通過し、置換後の JSON 構造検証も通過している

          CI が通り次第 auto-merge される。"

          # CI（build / gitleaks）通過を待って自動マージする
          gh pr merge --squash --auto

      # GITHUB_TOKEN によるマージは他ワークフローを起動しない（GitHub の再帰防止）。
      # そのままでは deploy.yml が発火せず reserves.json の更新がサイトに反映されない。
      # workflow_dispatch はこの制限の明示的な例外なので、デプロイを直接起動する。
      # auto-merge の完了を待ってから起動する。
      - name: Wait for merge and trigger deploy
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 40); do
            STATE=$(gh pr view --json state --jq .state 2>/dev/null || echo UNKNOWN)
            if [ "$STATE" = "MERGED" ]; then
              echo "PR merged. deploy を起動する"
              gh workflow run deploy.yml --ref main
              exit 0
            fi
            echo "merge 待ち ($i/40): state=$STATE"
            sleep 15
          done
          echo "::warning::auto-merge が10分以内に完了しなかった。マージ後 deploy.yml を手動起動すること"
