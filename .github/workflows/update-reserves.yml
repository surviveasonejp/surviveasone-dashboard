name: Update oil reserves data

# 資源エネルギー庁「石油備蓄の状況（推計値の速報）」PDF から備蓄日数を日次で取り込む。
#
# Worker 内のフェッチャー（reserves-fetcher.ts）ではなく CI で処理する理由:
# 当該 PDF は FlateDecode + CID エンコードで ToUnicode CMap を持たず、Worker では
# テキストを抽出できない。poppler(pdftotext) が必要なため CI 側で処理する。
#
# 値に変化があった時だけ RESERVES_PUSH_TOKEN（PAT）で main へ直接 push する。
#
# ## なぜ GITHUB_TOKEN ではなく PAT なのか（2026-07-25〜26 に全経路を実測して確定）
#
# 1. GITHUB_TOKEN の直 push は GH006 で拒否される。ブランチ保護が
#      - Changes must be made through a pull request.
#      - 2 of 2 required status checks are expected.
#    の2点で bot を弾く。管理者は enforce_admins:false でバイパスされるが bot は対象外。
# 2. classic 保護の bypass_pull_request_allowances に github-actions は登録できない
#    （API が 200 を返しても設定に反映されない）。
# 3. PR 経路へ切り替えても完走しない。GITHUB_TOKEN が作った PR では pull_request 起因の
#    CI が action_required で停止し（GitHub の再帰防止）、必須チェックが永久に揃わない。
#    workflow_dispatch で CI を明示起動すると check run はコミットに付くが、PR の
#    statusCheckRollup には算入されず mergeState は BLOCKED のままになる。
#
# PAT なら push が @idx 名義になり管理者バイパスが効く。GITHUB_TOKEN 起因ではないので
# deploy.yml も通常どおり発火し、サイト表示・OGP・API まで自動追随する。
#
# データの妥当性は scripts/update-reserves.mjs 側で担保する（絶対範囲・内訳整合・
# 前回比±50%・置換後の JSON 構造検証）。検証に落ちれば非ゼロ終了しコミットしない。

on:
  schedule:
    # 毎日 UTC 23:30（JST 08:30）。速報は平日に更新されるため朝までに取り込む
    - cron: '30 23 * * *'
  workflow_dispatch:

# GITHUB_TOKEN 自体には何も要求しない（push は PAT で行う）
permissions:
  contents: read

# 同時実行を防ぐ（push 競合の回避）
concurrency:
  group: update-reserves
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # 未設定だと checkout が GITHUB_TOKEN にフォールバックし、push 段階まで
      # 進んでから GH006 で失敗する。原因が分かる形で先に止める
      - name: Verify PAT is configured
        env:
          TOKEN: ${{ secrets.RESERVES_PUSH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::シークレット RESERVES_PUSH_TOKEN が未設定。" \
                 "このリポジトリの contents:write を持つ fine-grained PAT を登録すること" \
                 "（GITHUB_TOKEN ではブランチ保護により main へ push できない）"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # PAT で checkout することで後続の push も同じ資格情報で行われる
          token: ${{ secrets.RESERVES_PUSH_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22

      - name: Install poppler-utils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      # 抽出値が検証に通らない場合、スクリプトは非ゼロ終了して以降を止める
      # （誤ったデータが自動コミットされるのを防ぐ）
      - name: Fetch and update reserves.json
        id: update
        run: node scripts/update-reserves.mjs

      - name: Commit and push
        if: steps.update.outputs.changed == 'true'
        env:
          SUMMARY: ${{ steps.update.outputs.summary }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/worker/data/reserves.json
          git commit -m "data(reserves): ${SUMMARY}" \
                     -m "資源エネルギー庁「石油備蓄の状況（推計値の速報）」より自動取得 (.github/workflows/update-reserves.yml)"
          git push origin HEAD:main
